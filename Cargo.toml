[package]
name = "synth-piano-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Real-time physically-modelled acoustic piano synthesizer (Karplus-Strong / digital waveguide)"

[dependencies]
cpal = "0.17"
midir = "0.11"
ringbuf = "0.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
